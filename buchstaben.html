<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buchstaben-Blitz</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a2e;
    --muted: #c9cbd6;
    --primary: #2f6fde;
    --primary-fg: #ffffff;
    --check: #1f9d55;
    --panel: #f3f4f8;
    --border: #d9dbe4;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    display: flex;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .app {
    flex: 1;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 2vmin;
    padding: 2vmin;
  }
  .stage {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 0;
  }
  .label {
    font-size: max(14px, 4vmin);
    font-weight: 600;
    color: var(--check);
    height: 1.4em;
    visibility: hidden;
  }
  .label.show { visibility: visible; }
  .letter {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    line-height: 1;
    font-size: min(72vh, 55vw);
    color: var(--fg);
  }
  .letter.hidden { color: var(--muted); }
  .letter.checked { color: var(--check); }
  .bar {
    width: 60%;
    height: max(6px, 1.2vmin);
    background: var(--panel);
    border-radius: 99px;
    overflow: hidden;
    visibility: hidden;
  }
  .bar.show { visibility: visible; }
  .bar > div {
    height: 100%;
    width: 100%;
    background: var(--primary);
    transform-origin: left center;
  }
  .controls {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2vmin;
    width: max(150px, 24vw);
  }
  button {
    font: inherit;
    font-weight: 700;
    font-size: max(16px, 4.2vmin);
    padding: 0.7em 0.6em;
    border-radius: 0.5em;
    border: 3px solid transparent;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:active { transform: scale(0.97); }
  .btn-new { background: var(--primary); color: var(--primary-fg); }
  .btn-check { background: var(--bg); color: var(--check); border-color: var(--check); }
  .btn-check:disabled { color: var(--muted); border-color: var(--muted); cursor: default; }
  .settings {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4em;
    font-size: max(13px, 2.6vmin);
    color: #555;
  }
  .settings input {
    width: 4.2em;
    font: inherit;
    padding: 0.2em 0.3em;
    border: 1px solid var(--border);
    border-radius: 0.3em;
    text-align: center;
  }
  /* Schmale/hohe Fenster (z. B. kleines Embed-Widget): Buttons unter den Buchstaben */
  @media (max-aspect-ratio: 1/1) {
    .app { flex-direction: column; }
    .letter { font-size: min(50vh, 75vw); }
    .controls { width: 100%; flex-direction: row; flex-wrap: wrap; }
    .controls button { flex: 1; }
    .settings { width: 100%; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <div class="label" id="label">Es war:</div>
    <div class="letter hidden" id="letter" aria-live="polite">?</div>
    <div class="bar" id="bar"><div id="barFill"></div></div>
  </div>
  <div class="controls">
    <button class="btn-new" id="btnNew">Neuer Buchstabe</button>
    <button class="btn-check" id="btnCheck" disabled>Prüfen</button>
    <label class="settings">
      Anzeige
      <input type="number" id="duration" min="0" max="30" step="0.5">
      Sek.
    </label>
  </div>
</div>

<script>
(function () {
  "use strict";

  var LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  var DEFAULT_SECONDS = 2;

  var elLetter = document.getElementById("letter");
  var elLabel = document.getElementById("label");
  var elBar = document.getElementById("bar");
  var elBarFill = document.getElementById("barFill");
  var btnNew = document.getElementById("btnNew");
  var btnCheck = document.getElementById("btnCheck");
  var inpDuration = document.getElementById("duration");

  var current = null;   // zuletzt gezeigter Buchstabe
  var hideTimer = null;

  // Anzeigedauer: URL-Parameter ?t=2 > gespeicherter Wert > Standard
  function initialSeconds() {
    var p = new URLSearchParams(location.search).get("t");
    if (p !== null && !isNaN(parseFloat(p))) return clamp(parseFloat(p));
    try {
      var s = localStorage.getItem("buchstaben.seconds");
      if (s !== null && !isNaN(parseFloat(s))) return clamp(parseFloat(s));
    } catch (e) { /* Speicher im iFrame evtl. blockiert */ }
    return DEFAULT_SECONDS;
  }
  function clamp(v) { return Math.min(30, Math.max(0, v)); }
  function seconds() {
    var v = parseFloat(inpDuration.value);
    return isNaN(v) ? DEFAULT_SECONDS : clamp(v);
  }

  inpDuration.value = initialSeconds();
  inpDuration.addEventListener("change", function () {
    inpDuration.value = seconds();
    try { localStorage.setItem("buchstaben.seconds", String(seconds())); } catch (e) {}
  });

  // Zufallsbuchstabe, nie zweimal hintereinander derselbe
  function nextLetter() {
    var pool = LETTERS.filter(function (l) { return l !== current; });
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function stopTimer() {
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
    elBar.classList.remove("show");
    elBarFill.style.transition = "none";
    elBarFill.style.transform = "scaleX(1)";
  }

  function hideLetter() {
    stopTimer();
    elLetter.textContent = "?";
    elLetter.className = "letter hidden";
    btnCheck.disabled = false;
  }

  function showNew() {
    stopTimer();
    current = nextLetter();
    elLetter.textContent = current;
    elLetter.className = "letter";
    elLabel.classList.remove("show");
    btnCheck.disabled = true;

    var secs = seconds();
    if (secs > 0) {
      // Fortschrittsbalken als Countdown
      elBar.classList.add("show");
      void elBarFill.offsetWidth; // Reflow, damit die Transition neu startet
      elBarFill.style.transition = "transform " + secs + "s linear";
      elBarFill.style.transform = "scaleX(0)";
      hideTimer = setTimeout(hideLetter, secs * 1000);
    } else {
      btnCheck.disabled = false; // 0 = nicht ausblenden
    }
  }

  function check() {
    if (!current) return;
    stopTimer();
    elLetter.textContent = current;
    elLetter.className = "letter checked";
    elLabel.classList.add("show");
  }

  btnNew.addEventListener("click", showNew);
  btnCheck.addEventListener("click", check);

  // Tastatur: Leertaste/Enter = neu, P = prüfen
  document.addEventListener("keydown", function (e) {
    if (e.target === inpDuration) return;
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); showNew(); }
    else if (e.key === "p" || e.key === "P") { check(); }
  });
})();
</script>
</body>
</html>
